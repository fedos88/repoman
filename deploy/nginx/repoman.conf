# RepoMan reverse proxy.
#
# Used by docker-compose.dev.yml and as an example for production. In production add
# TLS termination (listen 443 ssl; ssl_certificate ...) and adjust upstream addresses.
#
#   /              -> frontend (static SPA)
#   /api/          -> backend  (REST API, Swagger)
#   /repository/   -> backend  (repository content, apt traffic)
#
# The address of this proxy must be listed in REPOMAN_TRUSTED_PROXIES of the backend.

upstream repoman_backend {
    server backend:8000;
    keepalive 16;
}

upstream repoman_frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location /repository/ {
        proxy_pass http://repoman_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Stream responses as they arrive; caching is done by the backend.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        # Must exceed the backend upstream read timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /api/ {
        proxy_pass http://repoman_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://repoman_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
