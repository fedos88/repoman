name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Minimum supported PostgreSQL version.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: repoman_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPOMAN_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/repoman_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Migrations match models
        env:
          REPOMAN_DATABASE_URL: postgresql://postgres:test@localhost:5432/repoman_test
          REPOMAN_STORAGE_PATH: /tmp/repoman
          REPOMAN_SECRET_KEY: ci-only-secret-key-ci-only-secret-key
        run: |
          python -c "from repoman.config import get_settings; from repoman.db.migrate import upgrade_to_head; upgrade_to_head(get_settings().database_url)"
          alembic check
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: i18n keys
        run: npm run i18n:check
      - name: Build
        run: npm run build
