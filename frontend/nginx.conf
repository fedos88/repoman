# Static SPA only. Routing of /api/ and /repository/ to the backend is done by the
# external reverse proxy (see deploy/nginx/repoman.conf).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
