# Used for development commands only (e.g. `alembic revision --autogenerate -m "..."`).
# The application applies migrations itself on startup.
# The database URL is taken from REPOMAN_DATABASE_URL.

[alembic]
script_location = %(here)s/src/repoman/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
